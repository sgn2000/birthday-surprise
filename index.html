<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0712">
  <title>Pavithra's Birthday Surprise ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="stars" aria-hidden="true"></div>

    <section class="card">
      <div class="tiny">A special surprise for Pavithra</div>

      <div class="orb" aria-hidden="true">
        <span>✦</span>
      </div>

      <h1>Pavithra's Birthday<br>Surprise is waiting for you…</h1>
      <p class="sub">Not yet. But very, very soon. 💫</p>

      <div class="countdown" aria-label="Birthday countdown">
        <div class="unit"><span id="days">00</span><small>Days</small></div>
        <div class="colon">:</div>
        <div class="unit"><span id="hours">00</span><small>Hours</small></div>
        <div class="colon">:</div>
        <div class="unit"><span id="minutes">00</span><small>Minutes</small></div>
        <div class="colon">:</div>
        <div class="unit"><span id="seconds">00</span><small>Seconds</small></div>
      </div>

      <p id="message" class="message">December 1 • 12:00 AM</p>

      <div class="hint">
        <span>♡</span>
        Come back when the countdown reaches zero.
      </div>
    </section>

    <footer>made with a little bit of magic</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
